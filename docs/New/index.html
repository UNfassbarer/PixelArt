<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel art Game</title>
    <link rel="stylesheet" href="./CSS/style.css">
    <link rel="stylesheet" href="./CSS/symbols.css">
    <link rel="stylesheet" href="./CSS/animations.css">
    <link href="https://fonts.googleapis.com/css?family=Lato:300" rel="stylesheet">
    <link rel="icon" href="favicon.ico">
</head>

<body>
    <!-- Menu tooltip -->
    <button type="button" class="StartButton CenterContent"><span>Start
            Game</span></button>

    <!-- Game menu -->
    <div id="Game_Menu" class="GameMenu CenterContent HiddenContent">

        <div id="Menu_Poster" class="MenuPoster CenterContent">
            <div id="Poster_Caption" class="PosterCaption">M</div>
            <canvas role="presentation"></canvas> <!-- -> class="BiggerPosterCanvas" -->
        </div>

        <div id="Menu_Content" class="MenuContent HiddenContent">

            <div class="MenuButtons">
                <button class="MenuButton" type="button" id="New_Game">
                    <span class="CenterObject">New Game</span>
                    <canvas role="presentation"></canvas>
                </button>
                <button class="MenuButton" type="button" id="IDK">
                    <span class="CenterObject">IDK</span>
                    <canvas role="presentation"></canvas>
                </button>
                <button class="MenuButton" type="button" id="Graphics">
                    <span class="CenterObject">Graphics</span>
                    <canvas role="presentation"></canvas>
                </button>
                <button class="MenuButton" type="button" id="Settings">
                    <span class="CenterObject">Settings</span>
                    <canvas role="presentation"></canvas>
                </button>
                <button class="MenuButton" type="button" id="Exit">
                    <span class="CenterObject">Exit</span>
                    <canvas role="presentation"></canvas>
                </button>
            </div>

            <div id="Menu_Settings" class="MenuSettings VanishedContent CenterContent">

                <!-- <button id="Game_Stats" type="button" class="Settings_Category">
                    Game stats <span>off</span>
                </button> -->

                <button id="Game_Stats" type="button" class="Settings_Category">
                    Game stats <span>off</span>
                </button>

                <button id="Game_Sounds" type="button" class="Settings_Category">
                    Game sounds <span>off</span>
                </button>

                <button id="Settings_Key_Assignment" type="button" class="Settings_Category ">Key
                    assignment</button>

                <button id="Game_Instructions" type="button" class="Settings_Category">Instructions</button>

            </div>
        </div>
    </div>

    <div class="gameWrapper CenterObject CenterContent">
        <canvas id="Game_Container" class="HiddenContent gameBox"></canvas>
    </div>

    <h1 id="Game_Over" class="GameOverBoard HiddenContent">GameOver</h1>

    <footer>
        <img id="Mute_Symbol" class="MuteSymbol" src="img/mute_Icon_off_day.png" alt="mute icon">

        <p class="FooterMain CenterContent"> &copy; 2026 Pixel Art Game &mdash; Created by Jonas Dickert. All rights
            reserved.</p>
        <a class="CenterContent" href="https://github.com/UNfassbarer" target="_blank" rel="noopener">
            Source code
        </a>

        <div class="ToolWrapper">
            <button id="InpressumButton" class="ImpressumButton CenterContent">^</button>
            <button id="ReloadButton" class="ReloadButton CenterContent">R</button>
        </div>
    </footer>


    <div class="SideMenu">

        <!-- GameInfoFadeOut -->
        <div id="Game_Info" class="GameInfo GameInfoFadeOut VanishedContent" inert>
            <div class="CenterContent">Deaths:</div><span id="Deaths" class="CenterContent">
                <h5>/</h5>
            </span>
            <div class="CenterContent">Game:</div><span id="Games_Played" class="CenterContent">
                <h5>/</h5>
            </span>
            <div class="CenterContent">Time:</div><span id="Survived_Time" class="CenterContent">
                <h5>/</h5>
            </span>
        </div>

        <!-- ImpressumFadeOut -->
        <div id="ImpressumWrapper" class="Impressum ImpressumFadeOut VanishedContent" inert>
            <div class="CenterContent">Anbieter:</div> <span class="CenterContent">
                <h5>Jonas Dickert</h5>
            </span>
            <div class="CenterContent">E-Mail:</div> <span class="CenterContent">
                <h5>djonas2810@gmail.com</h5>
            </span>
            <div class="CenterContent">Telefon:</div> <span class="CenterContent">
                <h5>+49 176 77918864</h5>
            </span>
            <div class="CenterContent">Website:</div> <span class="CenterContent">
                <a href="https://github.com/UNfassbarer" target="_blank" rel="noopener">
                    github.com/UNfassbarer
                </a>
            </span>
        </div>
    </div>

    <script type="module" src="script.js"></script>
    <script type="module" src="game.js"></script>
    <script type="module" src="assets.js"></script>
</body>

</html>
